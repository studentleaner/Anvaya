name: Anvaya secret scan (C4)

# C4 - fail the build if a secret is introduced by a commit on this ref.
# Runs on every push/PR and weekly; NOT path-filtered (a secret can land in a docs commit).
#
# Scope note: this scans the commit RANGE of the event (the commits being pushed /
# the PR's commits), not the full history or the whole working tree. This repo
# deliberately contains secret-SHAPED strings as test fixtures - `anvaya_api/redact.py`
# plus its tests use fake `sk-...`/`ghp_...` keys and the project-standard
# `Dragonflies123#` sample password to exercise the redactor (see docs/DECISIONS.md D-03).
# A full history/tree scan would be permanently red on those non-secrets, which would
# defeat the point of the gate. Scanning the pushed range still catches every NEW secret.
# When the fixtures move to a scan-excluded path, this can be widened to `--source .`.
on:
  push:
  pull_request:
  schedule:
    - cron: "12 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        run: |
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "$ZERO" ]; then
            echo "opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # New branch or manual/scheduled run with no range: scan just the tip commit.
            echo "opts=-1" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan commits for secrets
        run: gitleaks detect --redact --exit-code 1 --verbose --log-opts="${{ steps.range.outputs.opts }}"
