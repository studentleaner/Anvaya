[project]
name = "anvaya"
version = "0.0.1"
description = "Anvaya - the Ask Home intelligence layer for the HomeLab suite (all AI via AbstractAI, local models only)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.24",
    "pydantic>=2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["anvaya_api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
